services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports: ["3000:3000"]
    env_file:
      - /run/base44/app.env
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - WATCHPACK_POLLING=true
    command: ["sh","-ec","npm ci && exec npx next dev -H 0.0.0.0 -p 3000"]
    healthcheck:
      test: ["CMD-SHELL","node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 120s
    restart: on-failure
volumes:
  node_modules:
